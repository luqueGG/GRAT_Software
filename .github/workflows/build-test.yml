name: Build and Test

on:
  push:
    branches:
      - improvements/final
      - build/**
      - feature/**
      - test/**
      - docs/**
  pull_request:
    branches:
      - improvements/final

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        testing: [OFF, ON]
    env:
      # Headless execution helper; not a substitute for visual/manual QA.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6sql6-sqlite \
            qt6-svg-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev

      - name: Configure
        run: |
          cmake -S GRAT_Software \
                -B build \
                -G Ninja \
                -DBUILD_TESTING=${{ matrix.testing }}

      - name: Build
        run: |
          cmake --build build --verbose 2>&1 | tee build-${{ matrix.testing }}.log

      - name: Test
        if: matrix.testing == 'ON'
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.testing }}-logs
          path: |
            build-${{ matrix.testing }}.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
